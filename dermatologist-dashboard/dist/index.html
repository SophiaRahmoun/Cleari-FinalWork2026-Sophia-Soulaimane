    <script>
      // Decode the redirect from 404.html back into history
      (function() {
        var p = window.location.search.slice(1);
        if (p.indexOf('p=/') === 0) {
          var path = p.replace(/^p=/, '').replace(/~and~/g, '&').split('&q=');
          window.history.replaceState(null, null,
            window.location.pathname.split('/').slice(0, 2).join('/') +
            path[0] + (path[1] ? '?' + path[1] : '') + window.location.hash
          );
        }
      })();
    </script>
